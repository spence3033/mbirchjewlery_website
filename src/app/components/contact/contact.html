<section class="contact section" id="contact">
  <div class="contact-inner container">

    <div class="contact-content">
      <span class="section-label">Get in Touch</span>
      <h2>Let's talk<br><em>jewelry.</em></h2>
      <div class="divider"></div>
      <p>
        Have a question about a piece? Looking for something custom?
        Reach out on Facebook or send a message — we'd love to hear from you.
      </p>

      <div class="contact-links"
        href="https://facebook.com"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-link">

        <span class="contact-link-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
        </span>
        <span>Find us on Facebook</span>

        <a href="mailto:hello@mbirchjewelry.com" class="contact-link">
          <span class="contact-link-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <span>hello@mbirchjewelry.com</span>
        </a>
      </div>

      <div class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Your name" disabled />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="your@email.com" disabled />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Your message..." disabled></textarea>
        </div>
        <button class="btn-submit" disabled>
          Coming Soon
        </button>
      </div>
    </div>

  </div>
</section>
